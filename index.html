<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>M4定期テスト対策QB</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6f7786;--line:#dce3ec;--accent:#126fb3;--ok:#0b8a60;--bad:#d04444}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}.app{max-width:850px;margin:auto;padding:12px 10px 44px}button{font:inherit}.header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.brand{font-size:20px;font-weight:900}.crumb,.sub,.meta{font-size:12px;color:var(--muted);line-height:1.55}.btn,.mode{border:1px solid var(--line);background:#fff;border-radius:13px;min-height:44px;padding:0 14px;font-weight:800}.primary{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;min-height:50px;font-weight:900;font-size:16px}.secondary{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--accent);min-height:48px;font-weight:900;font-size:15px}.card,.list{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:10px}.list{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left}.title{font-size:20px;font-weight:900;margin:0 0 6px}.lt{font-size:17px;font-weight:900}.progress{height:8px;background:#e7ecf2;border-radius:999px;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:var(--accent)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.range{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin:7px 0}.range input,.problem input{width:22px;height:22px}.problem{padding:13px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:42px 1fr auto;gap:8px}.qid{font-weight:900;color:var(--accent)}.qtext{line-height:1.5}.hist{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.h{font-size:10px;padding:4px 6px;border-radius:7px;background:#eef1f5}.h.ok{background:#e8f6ee;color:var(--ok)}.h.bad{background:#fdecec;color:var(--bad)}.sticky{position:sticky;bottom:8px;background:rgba(245,247,251,.94);padding:8px 0;backdrop-filter:blur(8px)}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf4fb;font-size:11px;font-weight:800;margin:0 4px 5px 0}.badge.gray{background:#f0f2f5}.choices{display:grid;gap:8px;margin-top:12px}.choice{min-height:50px;border:1.5px solid var(--line);border-radius:13px;background:#fff;text-align:left;padding:12px;font-size:16px}.choice.sel{border-color:var(--accent);background:#eaf4fb}.choice.good{border-color:var(--ok);background:#e9f8f1}.choice.bad{border-color:var(--bad);background:#fff0f0}.choice:disabled{opacity:1}.historybox{background:#f8fafc;border-radius:13px;padding:10px;margin:12px 0}.result{font-size:22px;font-weight:900}.oktxt{color:var(--ok)}.badtxt{color:var(--bad)}.resultcard.ok{border:2px solid var(--ok);background:#effaf5}.resultcard.bad{border:2px solid var(--bad);background:#fff3f3}.resultcard.review{border:2px solid var(--accent);background:#f0f7fc}.line{font-size:14px;line-height:1.65;margin-top:5px}.summary{background:#f8fafc;border-radius:12px;padding:11px;font-weight:800}.exp{padding:11px 0;border-top:1px solid var(--line)}.exp:first-child{border-top:0}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;padding:14px;z-index:20}.sheet{width:min(760px,100%);background:#fff;border-radius:22px;padding:17px}.mode{width:100%;text-align:left;margin:7px 0;padding:12px}.hidden{display:none!important}.filters,.ratings{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.filter,.rate{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-weight:900}.filter.on{background:var(--accent);color:#fff}.rate.on{color:#fff}.rate[data-v="◎"].on{background:#154fa3}.rate[data-v="○"].on{background:#2e9de8}.rate[data-v="△"].on{background:#f5a623}.rate[data-v="×"].on{background:#ef476f}.rate[data-v="-"].on{background:#999}.fx{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:99;padding:18px 24px;border-radius:22px;color:#fff;font-size:26px;font-weight:950;box-shadow:0 18px 50px #0003;animation:pop .85s ease-out forwards}.fx.ok{background:var(--ok)}.fx.bad{background:var(--bad)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(.96)}}@media(max-width:520px){.brand{font-size:18px}.problem{grid-template-columns:32px 1fr}.problem .pick{grid-column:2}}</style></head><body><main class="app"><div class="header"><div><div class="brand">M4定期テスト対策QB</div><div id="crumb" class="crumb"></div></div><button id="home" class="btn hidden">科目一覧</button></div><div id="view"></div></main><div id="modal" class="modal hidden"><div class="sheet"><div class="title">演習方法を選択</div><div class="sub">選択した問題をどの順番で解くか選んでください。</div><button class="mode" data-mode="ordered"><b>順番通りに解く</b><br><span class="sub">学習用に整理した順番で演習</span></button><button class="mode" data-mode="shuffle"><b>シャッフルして解く</b><br><span class="sub">選択問題をランダム順で演習</span></button><button id="cancel" class="btn" style="width:100%">キャンセル</button></div></div><script src="data.js"></script><script src="data/assessment.js"></script><script src="data/principles.js"></script><script src="data/shoyaku.js"></script><script src="data/shoyaku_detail-1.js"></script><script src="data/prescription.js"></script><script src="data/exam.js"></script><script src="data/practice.js"></script><script src="data/research.js"></script><script>const questions=window.QB_QUESTIONS||[];const units=[['__all__','すべて（収録済み）'],['history','東洋医学の歴史'],['thought','中国古典医学の基盤となる思想'],['assessment','病気のアセスメント'],['principles','治療法の原則'],['shoyaku','生薬'],['shoyaku_detail','生薬各論'],['prescription','生薬から処方へ'],['exam','和漢医学の診察法'],['practice','和漢診療の実際'],['research','漢方薬研究の最前線'],['uncategorized','未分類・分類不明']];const STORE='m4_qb_v6';let state={screen:'subjects',unitId:null,selected:[],practice:[],pi:0,history:{},ratings:{},filters:[]};try{const old=JSON.parse(localStorage.getItem('m4_qb_v5')||'null');const cur=JSON.parse(localStorage.getItem(STORE)||'null');if(old)state={...state,...old};if(cur)state={...state,...cur}}catch(e){}const V=document.getElementById('view'),C=document.getElementById('crumb'),H=document.getElementById('home'),M=document.getElementById('modal');const save=()=>localStorage.setItem(STORE,JSON.stringify(state));const hist=id=>state.history[id]||[];const rating=id=>state.ratings[id]||'';function setRating(id,v){if(v)state.ratings[id]=v;else delete state.ratings[id];save()}function fmt(s){let d=new Date(s);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}function hhtml(id){let a=hist(id);if(!a.length)return '<span class="h">未演習</span>';return a.map((x,i)=>`<span class="h ${x.correct===true?'ok':x.correct===false?'bad':''}">${i===0?'前回':(i+1)+'回前'} ${x.correct===true?'○':x.correct===false?'×':'-'} ${fmt(x.at)}</span>`).join('')}function addAttempt(id,correct){state.history[id]=[{correct,at:new Date().toISOString()},...hist(id)].slice(0,3);save()}function qset(){return questions.filter(q=>state.unitId==='__all__'||q.unit===state.unitId)}function go(s){state.screen=s;save();render();scrollTo({top:0,behavior:'smooth'})}function render(){H.classList.toggle('hidden',state.screen==='subjects');if(state.screen==='subjects')subjects();else if(state.screen==='units')unitList();else if(state.screen==='problems')problems();else practice()}function subjects(){C.textContent='科目を選択';V.innerHTML=`<div class="card"><div class="title">科目一覧</div><div class="sub">勉強する科目を選んでください。</div></div><button id="wakan" class="list"><div><div class="lt">和漢医学概論</div><div class="meta">収録 ${questions.length}問</div></div><div>›</div></button>`;document.getElementById('wakan').onclick=()=>go('units')}function unitList(){C.textContent='和漢医学概論 ＞ 単元';V.innerHTML=`<div class="card"><div class="title">和漢医学概論</div><div class="sub">類題が近くなるよう学習順に整理しています。</div></div>`+units.map(u=>{let q=questions.filter(x=>u[0]==='__all__'||x.unit===u[0]),done=q.filter(x=>hist(x.id).length).length;return `<button class="list" data-u="${u[0]}"><div style="flex:1"><div class="lt">${u[1]}</div><div class="meta">${q.length}問・演習済み ${done}問</div><div class="progress"><div style="width:${q.length?done/q.length*100:0}%"></div></div></div><div>›</div></button>`}).join('');V.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{state.unitId=b.dataset.u;state.filters=[];state.selected=qset().map(q=>q.id);go('problems')})}function passFilter(q){if(!state.filters.length)return true;return state.filters.some(f=>f==='未演習'?!hist(q.id).length:rating(q.id)===f)}function problems(){let all=qset(),q=all.filter(passFilter);state.selected=state.selected.filter(id=>q.some(x=>x.id===id));if(!state.selected.length&&q.length)state.selected=q.map(x=>x.id);let subs=[...new Set(q.map(x=>x.subtopic))],name=units.find(x=>x[0]===state.unitId)?.[1]||'';C.textContent=`和漢医学概論 ＞ ${name} ＞ 問題一覧`;let s=`<div class="card"><div class="title">${name}</div><div class="sub">自己評価で絞り込んで復習できます。</div><div class="filters">${['◎','○','△','×','-','未演習'].map(v=>`<button class="filter ${state.filters.includes(v)?'on':''}" data-f="${v}">${v}</button>`).join('')}</div><div class="meta">表示 ${q.length}/${all.length}問</div></div><div class="card"><div class="row"><b>範囲選択</b><button id="all" class="btn">${state.selected.length===q.length&&q.length?'すべて解除':'すべて選択'}</button></div>`;subs.forEach(st=>{let z=q.filter(x=>x.subtopic===st),ck=z.length&&z.every(x=>state.selected.includes(x.id));s+=`<label class="range"><input type="checkbox" data-st="${st}" ${ck?'checked':''}><div><b>${st}</b><div class="meta">${z.length}問</div></div></label>`});s+='</div><div class="card"><b>問題一覧（'+q.length+'問）</b>';q.forEach((x,i)=>s+=`<div class="problem"><div class="qid">${i+1}</div><div><div class="qtext">${x.q}</div><div class="meta">${x.year}｜${x.exam}｜${x.qnum}</div><div class="hist"><span class="h">${rating(x.id)||'未評価'}</span>${hhtml(x.id)}</div></div><div class="pick"><input data-id="${x.id}" type="checkbox" ${state.selected.includes(x.id)?'checked':''}></div></div>`);s+=`</div><div class="sticky"><button id="start" class="primary">演習開始（${state.selected.length}問）</button></div>`;V.innerHTML=s;V.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{let v=b.dataset.f;state.filters=state.filters.includes(v)?state.filters.filter(x=>x!==v):[...state.filters,v];state.selected=[];save();problems()});document.getElementById('all').onclick=()=>{state.selected=state.selected.length===q.length?[]:q.map(x=>x.id);save();problems()};V.querySelectorAll('[data-st]').forEach(e=>e.onchange=()=>{let ids=q.filter(x=>x.subtopic===e.dataset.st).map(x=>x.id);state.selected=e.checked?[...new Set([...state.selected,...ids])]:state.selected.filter(x=>!ids.includes(x));save();problems()});V.querySelectorAll('[data-id]').forEach(e=>e.onchange=()=>{state.selected=e.checked?[...new Set([...state.selected,e.dataset.id])]:state.selected.filter(x=>x!==e.dataset.id);save();problems()});document.getElementById('start').onclick=()=>{if(!state.selected.length)return alert('1問以上選択してください。');M.classList.remove('hidden')}}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}M.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.practice=b.dataset.mode==='shuffle'?shuffle(state.selected):[...state.selected];state.pi=0;M.classList.add('hidden');sel=new Set();submitted=false;reviewOnly=false;go('practice')});document.getElementById('cancel').onclick=()=>M.classList.add('hidden');let sel=new Set(),submitted=false,reviewOnly=false;const pq=()=>questions.find(x=>x.id===state.practice[state.pi]);function rateBtns(id){return ['◎','○','△','×','-'].map(v=>`<button class="rate ${rating(id)===v?'on':''}" data-v="${v}">${v}</button>`).join('')}function practice(){let q=pq();if(!q)return go('problems');let name=units.find(x=>x[0]===state.unitId)?.[1]||'';C.textContent=`和漢医学概論 ＞ ${name} ＞ 演習`;V.innerHTML=`<div class="row"><button id="back" class="btn">‹ 問題一覧</button><div style="text-align:right"><b>演習 ${state.pi+1}/${state.practice.length}問目</b><div class="meta">履歴 ${hist(q.id).length}/3件</div></div></div><div class="progress"><div style="width:${(state.pi+1)/state.practice.length*100}%"></div></div><div class="card" style="margin-top:12px"><div><span class="badge">${q.year}</span><span class="badge gray">${q.exam}</span><span class="badge gray">${q.qnum}</span><span class="badge gray">複数選択可</span></div><div class="title" style="margin-top:8px">${q.q}</div><div class="sub">正しいと思う選択肢をすべて選んでください。解答せず解説だけ確認することもできます。</div><div id="choices" class="choices"></div><div class="historybox"><b>直近3回</b><div class="hist">${hhtml(q.id)}</div></div><div class="ratings"><span class="meta" style="align-self:center">自己評価：</span>${rateBtns(q.id)}</div><button id="submit" class="primary" style="margin-top:12px">${submitted&&!reviewOnly?'もう一度解く':'解答する'}</button>${submitted?'':`<button id="reviewOnly" class="secondary" style="margin-top:8px">解答せずに解説を見る</button>`}</div><div id="ans" class="${submitted?'':'hidden'}"></div><div class="nav"><button id="prev" class="btn" ${state.pi===0?'disabled':''}>← 前の問題</button><button id="next" class="btn">${state.pi===state.practice.length-1?'演習終了':'次の問題 →'}</button></div>`;drawChoices();V.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{setRating(q.id,b.dataset.v);practice()});document.getElementById('back').onclick=()=>{sel=new Set();submitted=false;reviewOnly=false;go('problems')};document.getElementById('submit').onclick=submitted&&!reviewOnly?retry:submit;document.getElementById('reviewOnly')?.addEventListener('click',showExplanationOnly);document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>state.pi===state.practice.length-1?(sel=new Set(),submitted=false,reviewOnly=false,go('problems')):move(1);if(submitted)drawAnswer()}function drawChoices(){let q=pq(),b=document.getElementById('choices');if(!b)return;b.innerHTML='';q.choices.forEach((x,i)=>{let e=document.createElement('button');let cls='choice'+(sel.has(i)?' sel':'');if(submitted){if(q.ans.includes(i))cls+=' good';else if(sel.has(i))cls+=' bad'}e.className=cls;e.textContent=(submitted?(q.ans.includes(i)?'✓ ':sel.has(i)?'✕ ':''):'')+String.fromCharCode(97+i)+'. '+x;e.disabled=submitted;e.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i);drawChoices()};b.appendChild(e)})}function same(a,b){return a.length===b.length&&[...a].sort().every((x,i)=>x===[...b].sort()[i])}function submit(){if(!sel.size)return alert('1つ以上選択してください。解答せず確認したい場合は「解答せずに解説を見る」を押してください。');let q=pq(),ok=same([...sel],q.ans);reviewOnly=false;submitted=true;addAttempt(q.id,ok);setRating(q.id,ok?'○':'×');let d=document.createElement('div');d.className='fx '+(ok?'ok':'bad');d.textContent=ok?'✓ 正解！':'✕ 不正解';document.body.appendChild(d);setTimeout(()=>d.remove(),900);practice();requestAnimationFrame(()=>document.getElementById('ans')?.scrollIntoView({behavior:'smooth',block:'start'}))}function showExplanationOnly(){let q=pq();sel=new Set();reviewOnly=true;submitted=true;addAttempt(q.id,null);setRating(q.id,'-');practice();requestAnimationFrame(()=>document.getElementById('ans')?.scrollIntoView({behavior:'smooth',block:'start'}))}function drawAnswer(){let q=pq(),ok=!reviewOnly&&same([...sel],q.ans),A=document.getElementById('ans');A.className='';A.innerHTML=`<div class="card resultcard ${reviewOnly?'review':ok?'ok':'bad'}"><div class="result ${reviewOnly?'':ok?'oktxt':'badtxt'}">${reviewOnly?'解説モード（未解答）':ok?'✓ 正解！':'✕ 不正解'}</div><b>正解：${q.ans.map(i=>String.fromCharCode(97+i)).join('・')}　${q.ans.map(i=>q.choices[i]).join('・')}</b>${reviewOnly?'<div class="meta" style="margin-top:6px">自己評価は「-」として記録しました。</div>':''}</div><div class="card"><b>■ 問題文のポイント</b><div class="line">${q.note||''}</div></div><div class="card"><b>■ 各選択肢</b>${q.choices.map((c,i)=>`<div class="exp"><b>${String.fromCharCode(97+i)}. ${q.ans.includes(i)?'○':'×'}　${c}</b><div class="line">${q.ans.includes(i)?'この問題では正しい選択肢。':'この問題では誤り。'} ${q.note||''}</div></div>`).join('')}</div><div class="card"><b>■ 出題者の意図</b><div class="line">→ ${q.subtopic}の典型事項を区別できるかを問う問題。</div></div><div class="card"><b>■ 試験用まとめ</b><div class="summary">${q.note||''}</div></div>`}function retry(){sel=new Set();submitted=false;reviewOnly=false;practice();requestAnimationFrame(()=>scrollTo({top:0,behavior:'smooth'}))}function move(d){state.pi+=d;save();sel=new Set();submitted=false;reviewOnly=false;practice();scrollTo({top:0,behavior:'smooth'})}H.onclick=()=>{state.screen='subjects';state.unitId=null;state.selected=[];state.practice=[];state.pi=0;sel=new Set();submitted=false;reviewOnly=false;save();render()};render();</script></body></html>
