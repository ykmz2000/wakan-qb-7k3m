<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>M4定期テスト対策QB</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#142033;--muted:#697386;--line:#dfe5ee;--accent:#0f79b8;--accent2:#e8f4fb;--ok:#147a46;--bad:#b42318}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}button{font:inherit}.app{max-width:820px;margin:auto;padding:14px 11px 50px}.header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.brand{font-size:20px;font-weight:900}.crumb,.sub,.meta2{font-size:12px;color:var(--muted);line-height:1.5}.btn{border:1px solid var(--line);background:#fff;border-radius:13px;min-height:44px;padding:0 14px;font-weight:800}.primary{border:0;background:var(--accent);color:#fff;border-radius:14px;min-height:50px;width:100%;font-weight:900}.card,.list{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:10px}.list{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left}.title{font-size:20px;font-weight:900;margin:0 0 5px}.lt{font-size:17px;font-weight:850}.progress{height:8px;background:#e7ecf2;border-radius:99px;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:var(--accent)}.range{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:13px;margin:7px 0}.range input,.problem input{width:21px;height:21px}.problem{padding:13px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:42px 1fr auto;gap:8px}.num{font-weight:900;color:var(--accent)}.qtext{line-height:1.5}.hist{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.h{font-size:10px;padding:4px 6px;border-radius:7px;background:#eef1f5}.h.ok{background:#e8f6ee;color:var(--ok)}.h.bad{background:#fdecec;color:var(--bad)}.sticky{position:sticky;bottom:8px;background:rgba(245,247,251,.94);padding:8px 0;backdrop-filter:blur(8px)}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;padding:14px;z-index:10}.hidden{display:none}.sheet{width:min(760px,100%);background:#fff;border-radius:22px;padding:17px}.mode{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;margin:7px 0}.mode b{font-size:16px}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:var(--accent2);font-size:11px;font-weight:800;margin:0 4px 5px 0}.badge.gray{background:#f0f2f5}.choices{display:grid;gap:8px;margin-top:12px}.choice{min-height:50px;border:1.5px solid var(--line);border-radius:13px;background:#fff;text-align:left;padding:12px;font-size:16px}.choice.sel{border-color:var(--accent);background:var(--accent2)}.historybox{background:#f8fafc;border-radius:13px;padding:10px;margin:12px 0}.result{font-size:20px;font-weight:900}.oktxt{color:var(--ok)}.badtxt{color:var(--bad)}.exp{border-top:1px solid var(--line);padding:11px 0}.exp:first-child{border-top:0}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.line{font-size:14px;line-height:1.65;margin-top:4px}.summary{background:#f8fafc;border-radius:12px;padding:11px;font-weight:800}.loading{text-align:center;padding:60px 0;color:var(--muted)}@media(max-width:520px){.brand{font-size:18px}.problem{grid-template-columns:32px 1fr}.problem .pick{grid-column:2}.app{padding:11px 9px 40px}}
</style></head><body><main class="app"><div class="header"><div><div class="brand">M4定期テスト対策QB</div><div id="crumb" class="crumb"></div></div><button id="home" class="btn hidden">科目一覧</button></div><div id="view"><div class="loading">問題データを読み込み中…</div></div></main><div id="modal" class="modal hidden"><div class="sheet"><div class="title">演習方法を選択</div><div class="sub">選択した問題をどの順番で解くか選んでください。</div><button class="mode" data-mode="ordered"><b>順番通りに解く</b><br><span class="sub">PDFの掲載順で演習</span></button><button class="mode" data-mode="shuffle"><b>シャッフルして解く</b><br><span class="sub">選択問題をランダム順で演習</span></button><button id="cancel" class="btn" style="width:100%">キャンセル</button></div></div><script>
const units=[['history','東洋医学の歴史',1],['thought','中国古典医学の基盤となる思想',0],['assessment','病気のアセスメント',0],['principles','治療法の原則',0],['shoyaku','生薬',0],['shoyaku_detail','生薬各論',0],['prescription','生薬から処方へ',0],['exam','和漢医学の診察法',0],['practice','和漢医学の実際',0],['research','漢方薬研究の最前線',0],['uncategorized','未分類',0]];
let questions=[];const files=[1,2,3,4,5,6].map(n=>`data/history-${n}.json`);const STORE='m4_qb_v4';let state={screen:'subjects',unitId:null,selected:[],practice:[],pi:0,history:{}};try{Object.assign(state,JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){}const V=document.getElementById('view'),C=document.getElementById('crumb'),H=document.getElementById('home'),M=document.getElementById('modal');const save=()=>localStorage.setItem(STORE,JSON.stringify(state));const hist=id=>state.history[id]||[];const fmt=s=>{let d=new Date(s);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};function hhtml(id){let a=hist(id);if(!a.length)return '<span class="h">未演習</span>';return a.map((x,i)=>`<span class="h ${x.correct?'ok':'bad'}">${i===0?'前回':(i+1)+'回前'} ${x.correct?'○':'×'} ${fmt(x.at)}</span>`).join('')};function addAttempt(id,correct){state.history[id]=[{correct,at:new Date().toISOString()},...hist(id)].slice(0,3);save()}function qs(){return questions.filter(q=>q.unit===state.unitId)}function go(s){state.screen=s;save();render();scrollTo({top:0,behavior:'smooth'})}function render(){H.classList.toggle('hidden',state.screen==='subjects');if(state.screen==='subjects')subjects();else if(state.screen==='units')unitList();else if(state.screen==='problems')problems();else practice()}function subjects(){C.textContent='科目を選択';V.innerHTML=`<div class="card"><div class="title">科目一覧</div><div class="sub">科目を選んでください。</div></div><button id="wakan" class="list"><div><div class="lt">和漢医学概論</div><div class="meta2">収録 ${questions.length}問</div></div><div>›</div></button><button class="list" disabled><div><div class="lt">他科目</div><div class="meta2">今後追加</div></div></button>`;document.getElementById('wakan').onclick=()=>go('units')}function unitList(){C.textContent='和漢医学概論 ＞ 単元';V.innerHTML=`<div class="card"><div class="title">和漢医学概論</div><div class="sub">PDFの見出し順です。末尾の分類しにくい問題は「未分類」にまとめます。</div></div>`+units.map(u=>{let q=questions.filter(x=>x.unit===u[0]),done=q.filter(x=>hist(x.id).length).length;return `<button class="list" data-u="${u[0]}" ${u[2]?'':'disabled'}><div style="flex:1"><div class="lt">${u[1]}</div><div class="meta2">${u[2]?`${q.length}問・演習済み ${done}問`:'準備中'}</div>${u[2]?`<div class="progress"><div style="width:${q.length?done/q.length*100:0}%"></div></div>`:''}</div><div>${u[2]?'›':''}</div></button>`}).join('');V.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{state.unitId=b.dataset.u;state.selected=qs().map(q=>q.id);go('problems')})}function problems(){let q=qs();if(!state.selected.length)state.selected=q.map(x=>x.id);let subs=[...new Set(q.map(x=>x.subtopic))];C.textContent=`和漢医学概論 ＞ ${units.find(x=>x[0]===state.unitId)[1]} ＞ 問題一覧`;let s=`<div class="card"><div class="title">${units.find(x=>x[0]===state.unitId)[1]}</div><div class="sub">小テーマはPDFの掲載順を保ったまま整理しています。</div></div><div class="card"><div class="toprow"><b>範囲選択</b><button id="all" class="btn">${state.selected.length===q.length?'すべて解除':'すべて選択'}</button></div>`;subs.forEach(st=>{let z=q.filter(x=>x.subtopic===st),ck=z.every(x=>state.selected.includes(x.id));s+=`<label class="range"><input type="checkbox" data-st="${st}" ${ck?'checked':''}><div><b>${st}</b><div class="meta2">${z.length}問</div></div></label>`});s+='</div><div class="card"><b>問題一覧（'+q.length+'問）</b>';q.forEach((x,i)=>s+=`<div class="problem"><div class="num">${i+1}</div><div><div class="qtext">${x.q}</div><div class="meta2">${x.year}｜${x.exam}｜${x.qnum}</div><div class="hist">${hhtml(x.id)}</div></div><div class="pick"><input data-id="${x.id}" type="checkbox" ${state.selected.includes(x.id)?'checked':''}></div></div>`);s+=`</div><div class="sticky"><button id="start" class="primary">演習開始（${state.selected.length}問）</button></div>`;V.innerHTML=s;document.getElementById('all').onclick=()=>{state.selected=state.selected.length===q.length?[]:q.map(x=>x.id);save();problems()};V.querySelectorAll('[data-st]').forEach(e=>e.onchange=()=>{let ids=q.filter(x=>x.subtopic===e.dataset.st).map(x=>x.id);state.selected=e.checked?[...new Set([...state.selected,...ids])]:state.selected.filter(x=>!ids.includes(x));save();problems()});V.querySelectorAll('[data-id]').forEach(e=>e.onchange=()=>{state.selected=e.checked?[...new Set([...state.selected,e.dataset.id])]:state.selected.filter(x=>x!==e.dataset.id);save();problems()});document.getElementById('start').onclick=()=>{if(!state.selected.length)return alert('1問以上選択してください。');M.classList.remove('hidden')}}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}M.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.practice=b.dataset.mode==='shuffle'?shuffle(state.selected):[...state.selected];state.pi=0;M.classList.add('hidden');go('practice')});document.getElementById('cancel').onclick=()=>M.classList.add('hidden');let sel=new Set(),submitted=false;const pq=()=>questions.find(x=>x.id===state.practice[state.pi]);function practice(){let q=pq();if(!q)return go('problems');C.textContent=`和漢医学概論 ＞ ${units.find(x=>x[0]===state.unitId)[1]} ＞ 演習`;V.innerHTML=`<div class="toprow"><button id="back" class="btn">‹ 問題一覧</button><div style="text-align:right"><b>演習 ${state.pi+1}/${state.practice.length}問目</b><div class="meta2">履歴 ${hist(q.id).length}/3件</div></div></div><div class="progress"><div style="width:${(state.pi+1)/state.practice.length*100}%"></div></div><div class="card" style="margin-top:12px"><div><span class="badge">${q.year}</span><span class="badge gray">${q.exam}</span><span class="badge gray">${q.qnum}</span><span class="badge gray">複数選択可</span></div><div class="title" style="margin-top:8px">${q.q}</div><div class="sub">正しいと思う選択肢をすべて選んで「解答する」を押してください。</div><div id="choices" class="choices"></div><div class="historybox"><b>直近3回</b><div class="hist">${hhtml(q.id)}</div></div><button id="submit" class="primary">解答する</button></div><div id="ans" class="hidden"></div><div class="nav"><button id="prev" class="btn" ${state.pi===0?'disabled':''}>← 前の問題</button><button id="next" class="btn">${state.pi===state.practice.length-1?'演習終了':'次の問題 →'}</button></div>`;drawChoices();document.getElementById('back').onclick=()=>{sel=new Set();submitted=false;go('problems')};document.getElementById('submit').onclick=submit;document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>state.pi===state.practice.length-1?(sel=new Set(),submitted=false,go('problems')):move(1)}function drawChoices(){let q=pq(),b=document.getElementById('choices');b.innerHTML='';q.choices.forEach((x,i)=>{let e=document.createElement('button');e.className='choice'+(sel.has(i)?' sel':'');e.textContent=String.fromCharCode(97+i)+'. '+x;e.disabled=submitted;e.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i);drawChoices()};b.appendChild(e)})}function same(a,b){return a.length===b.length&&[...a].sort().every((x,i)=>x===[...b].sort()[i])}function submit(){if(!sel.size)return alert('1つ以上選択してください。');let q=pq(),ok=same([...sel],q.ans);submitted=true;addAttempt(q.id,ok);drawChoices();document.getElementById('submit').disabled=true;let A=document.getElementById('ans');A.classList.remove('hidden');A.innerHTML=`<div class="card"><div class="result ${ok?'oktxt':'badtxt'}">${ok?'○ 正解！':'× 不正解'}</div><b>正解：${q.ans.map(i=>String.fromCharCode(97+i)).join('・')}　${q.ans.map(i=>q.choices[i]).join('・')}</b></div><div class="card"><b>■ 問題文のポイント</b>${q.points.map(x=>`<div class="line">・${x}</div>`).join('')}</div><div class="card"><b>■ 各選択肢</b>${q.exps.map((e,i)=>`<div class="exp"><b>${String.fromCharCode(97+i)}. ${e[0]}　${q.choices[i]}</b><div class="line">理由：${e[1]}</div>${e[2]?`<div class="line">${e[2]}</div>`:''}</div>`).join('')}</div><div class="card"><b>■ 出題者の意図</b><div class="line">→ ${q.intent}</div></div><div class="card"><b>■ 試験用まとめ</b><div class="summary">${q.summary}</div></div>`;requestAnimationFrame(()=>A.scrollIntoView({behavior:'smooth',block:'start'}))}function move(d){state.pi+=d;save();sel=new Set();submitted=false;practice();scrollTo({top:0,behavior:'smooth'})}H.onclick=()=>{state.screen='subjects';state.unitId=null;state.selected=[];state.practice=[];state.pi=0;save();render()};Promise.all(files.map(f=>fetch(f).then(r=>r.json()))).then(a=>{questions=a.flat();render()}).catch(e=>{V.innerHTML='<div class="card"><b>問題データの読み込みに失敗しました。</b><div class="sub">再読み込みしてください。</div></div>'});
</script></body></html>
