<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><title>M4定期テスト対策QB</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6f7786;--line:#dce3ec;--accent:#126fb3;--accent2:#eaf4fb;--ok:#0b8a60;--bad:#d04444}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
button{font:inherit}.app{max-width:850px;margin:auto;padding:14px 12px 44px}.header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.brand{font-size:21px;font-weight:900}.crumb{font-size:12px;color:var(--muted);margin-top:4px}.headerBtn{background:white;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:800}.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.title{font-size:21px;font-weight:900;margin:0 0 6px}.sub{font-size:13px;color:var(--muted);line-height:1.6}.listBtn{width:100%;background:white;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;margin:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.listBtn:disabled{opacity:.45}.listTitle{font-size:17px;font-weight:900}.listMeta{font-size:12px;color:var(--muted);margin-top:5px}.arrow{font-size:24px;color:var(--muted)}
.progress{height:8px;background:#e7ecf2;border-radius:999px;overflow:hidden;margin-top:9px}.progress>div{height:100%;background:var(--accent)}.sectionTitle{font-weight:900;margin-bottom:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.secondary{border:1px solid var(--line);background:#fff;border-radius:13px;min-height:44px;padding:0 14px;font-weight:800}.primary{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;min-height:50px;font-weight:900;font-size:16px}
.checkRow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:15px;background:white;padding:13px;margin:7px 0}.checkRow input,.problemCheck{width:22px;height:22px}.grow{flex:1}.problemRow{border-bottom:1px solid var(--line);padding:13px 0}.problemRow:last-child{border-bottom:0}.problemTop{display:grid;grid-template-columns:50px 1fr auto;gap:10px}.qid{font-weight:900;color:var(--accent)}.qtext{line-height:1.5}.historyMini{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.mini{font-size:11px;padding:4px 6px;border-radius:7px;background:#f0f2f5}.mini.ok{background:#e9f7ef;color:var(--ok)}.mini.bad{background:#fdecec;color:var(--bad)}.stickyBar{position:sticky;bottom:8px;padding:10px 0;background:rgba(245,247,251,.95);backdrop-filter:blur(8px)}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.badge{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;background:var(--accent2)}.badge.gray{background:#f3f4f6}.choices{display:grid;gap:9px}.choice{width:100%;min-height:52px;background:#fff;border:1.5px solid var(--line);border-radius:14px;text-align:left;padding:13px 14px;font-size:16px}.choice.selected{border-color:var(--accent);background:var(--accent2)}.choice:disabled{opacity:1}.historyBox{margin-top:12px;padding:10px;border-radius:12px;background:#f8fafc}.line{font-size:14px;line-height:1.65;margin-top:5px}.result{font-size:22px;font-weight:900}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.expItem{padding:12px 0;border-top:1px solid var(--line)}.expItem:first-child{border-top:0}.expHead{font-weight:900}.summary{background:#f8fafc;border-radius:14px;padding:12px;font-weight:800;line-height:1.65}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.42);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:50}.sheet{width:min(760px,100%);background:white;border-radius:22px;padding:18px}.modeBtn{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:15px;text-align:left;margin-top:9px}.modeBtn strong{display:block;font-size:17px}.modeBtn span{font-size:12px;color:var(--muted)}
@media(max-width:520px){.brand{font-size:18px}.app{padding:11px 9px 38px}.problemTop{grid-template-columns:42px 1fr}.problemTop>.statusCol{grid-column:2}}
</style></head>
<body><main class="app"><div class="header"><div><div class="brand">M4定期テスト対策QB</div><div id="crumb" class="crumb"></div></div><button id="homeBtn" class="headerBtn hidden">科目一覧</button></div><div id="view"></div></main>
<div id="modeModal" class="modal hidden"><div class="sheet"><div class="title">演習方法を選択</div><div class="sub">選択した問題をどの順番で解くか選んでください。</div><button class="modeBtn" data-mode="ordered"><strong>順番通りに解く</strong><span>PDF・問題一覧の順序で演習します</span></button><button class="modeBtn" data-mode="shuffle"><strong>シャッフルして解く</strong><span>問題をランダム順に並べます</span></button><button id="cancelModal" class="secondary" style="width:100%;margin-top:12px">キャンセル</button></div></div>
<script src="data.js"></script>
<script>
const questions=window.QB_QUESTIONS||[];
const subjects=[{id:'wakan',name:'和漢医学概論',units:[
{id:'__all__',name:'すべて（収録済み）',enabled:true},
{id:'history',name:'東洋医学の歴史',enabled:true},
{id:'thought',name:'中国古典医学の基盤となる思想',enabled:true},
{id:'assessment',name:'病気のアセスメント',enabled:false},
{id:'principles',name:'治療法の原則',enabled:false},
{id:'shoyaku',name:'生薬',enabled:false},{id:'shoyaku_detail',name:'生薬各論',enabled:false},{id:'prescription',name:'生薬から処方へ',enabled:false},{id:'exam',name:'和漢医学の診察法',enabled:false},{id:'practice',name:'和漢診療の実際',enabled:false},{id:'research',name:'漢方薬研究の最前線',enabled:false},{id:'uncategorized',name:'未分類・分類不明',enabled:true}
]}];
const STORE='m4_qb_v5';
let state={screen:'subjects',subjectId:null,unitId:null,selectedIds:[],practiceIds:[],practiceIndex:0,history:{}};
try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s)state={...state,...s}}catch(e){}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function hist(id){return state.history[id]||[]}
function addAttempt(id,correct){state.history[id]=[{correct,at:new Date().toISOString()},...hist(id)].slice(0,3);save()}
function fmt(iso){const d=new Date(iso);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function histHTML(id,compact=false){const h=hist(id);if(!h.length)return compact?'<span class="mini">未演習</span>':'<div class="line">まだ演習履歴はありません。</div>';return h.map((a,i)=>compact?`<span class="mini ${a.correct?'ok':'bad'}">${i===0?'前回':(i+1)+'回前'} ${a.correct?'○':'×'} ${fmt(a.at)}</span>`:`<div class="line"><strong>${i===0?'前回':(i+1)+'回前'}：</strong>${a.correct?'○ 正解':'× 不正解'}　${fmt(a.at)}</div>`).join('')}
const view=document.getElementById('view'),crumb=document.getElementById('crumb'),homeBtn=document.getElementById('homeBtn'),modal=document.getElementById('modeModal');
function subject(){return subjects.find(s=>s.id===state.subjectId)}
function unit(){return subject()?.units.find(u=>u.id===state.unitId)}
function qForUnit(){return questions.filter(q=>q.subject===state.subjectId&&(state.unitId==='__all__'||q.unit===state.unitId))}
function go(screen){state.screen=screen;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){homeBtn.classList.toggle('hidden',state.screen==='subjects');if(state.screen==='subjects')renderSubjects();else if(state.screen==='units')renderUnits();else if(state.screen==='problems')renderProblems();else if(state.screen==='practice')renderPractice()}
function renderSubjects(){crumb.textContent='科目を選択';view.innerHTML=`<section class="card"><h1 class="title">科目一覧</h1><div class="sub">勉強する科目を選んでください。</div></section>`+subjects.map(s=>{const count=questions.filter(q=>q.subject===s.id).length;return `<button class="listBtn" data-subject="${s.id}"><div><div class="listTitle">${s.name}</div><div class="listMeta">収録 ${count}問</div></div><div class="arrow">›</div></button>`}).join('');view.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{state.subjectId=b.dataset.subject;go('units')})}
function renderUnits(){crumb.textContent=`${subject().name} ＞ 単元`;view.innerHTML=`<section class="card"><h1 class="title">${subject().name}</h1><div class="sub">単元を選んでください。「すべて」から収録済み単元をまとめて演習できます。</div></section>`+subject().units.map(u=>{const qs=questions.filter(q=>q.subject===state.subjectId&&(u.id==='__all__'||q.unit===u.id));const attempted=qs.filter(q=>hist(q.id).length).length;return `<button class="listBtn" ${u.enabled?'':'disabled'} data-unit="${u.id}"><div style="flex:1"><div class="listTitle">${u.name}</div><div class="listMeta">${u.enabled?`${qs.length}問・演習済み ${attempted}問`:'準備中'}</div>${u.enabled?`<div class="progress"><div style="width:${qs.length?attempted/qs.length*100:0}%"></div></div>`:''}</div><div class="arrow">${u.enabled?'›':''}</div></button>`}).join('');view.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{if(b.disabled)return;state.unitId=b.dataset.unit;state.selectedIds=qForUnit().map(q=>q.id);go('problems')})}
function renderProblems(){const qs=qForUnit();const title=unit().name;if(!state.selectedIds.some(id=>qs.some(q=>q.id===id)))state.selectedIds=qs.map(q=>q.id);state.selectedIds=state.selectedIds.filter(id=>qs.some(q=>q.id===id));const subs=[...new Set(qs.map(q=>q.subtopic))];crumb.textContent=`${subject().name} ＞ ${title} ＞ 問題一覧`;let html=`<section class="card"><h1 class="title">${title}</h1><div class="sub">小テーマ順に整理しています。範囲を選択してから「演習開始」を押してください。</div></section><section class="card"><div class="row"><div class="sectionTitle">範囲選択</div><button id="toggleAll" class="secondary">${state.selectedIds.length===qs.length?'すべて解除':'すべて選択'}</button></div>`;subs.forEach(st=>{const sq=qs.filter(q=>q.subtopic===st),checked=sq.every(q=>state.selectedIds.includes(q.id));html+=`<label class="checkRow"><input type="checkbox" data-subtopic="${st}" ${checked?'checked':''}><div class="grow"><strong>${st}</strong><div class="listMeta">${sq.length}問</div></div></label>`});html+=`</section><section class="card"><div class="sectionTitle">問題一覧（${qs.length}問）</div>`;qs.forEach((q,i)=>{html+=`<div class="problemRow"><div class="problemTop"><div class="qid">${i+1}</div><div><div class="qtext">${q.q}</div><div class="listMeta">${q.year}｜${q.exam}｜${q.qnum}</div><div class="historyMini">${histHTML(q.id,true)}</div></div><div class="statusCol"><input class="problemCheck" type="checkbox" data-qid="${q.id}" ${state.selectedIds.includes(q.id)?'checked':''}></div></div></div>`});html+=`</section><div class="stickyBar"><button id="startPractice" class="primary">演習開始（${state.selectedIds.length}問）</button></div>`;view.innerHTML=html;document.getElementById('toggleAll').onclick=()=>{state.selectedIds=state.selectedIds.length===qs.length?[]:qs.map(q=>q.id);save();renderProblems()};view.querySelectorAll('[data-subtopic]').forEach(cb=>cb.onchange=()=>{const ids=qs.filter(q=>q.subtopic===cb.dataset.subtopic).map(q=>q.id);state.selectedIds=cb.checked?[...new Set([...state.selectedIds,...ids])]:state.selectedIds.filter(id=>!ids.includes(id));save();renderProblems()});view.querySelectorAll('[data-qid]').forEach(cb=>cb.onchange=()=>{state.selectedIds=cb.checked?[...new Set([...state.selectedIds,cb.dataset.qid])]:state.selectedIds.filter(id=>id!==cb.dataset.qid);save();renderProblems()});document.getElementById('startPractice').onclick=()=>{if(!state.selectedIds.length){alert('1問以上選択してください。');return}modal.classList.remove('hidden')}}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
modal.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.practiceIds=b.dataset.mode==='shuffle'?shuffle(state.selectedIds):[...state.selectedIds];state.practiceIndex=0;modal.classList.add('hidden');currentSelection=new Set();currentSubmitted=false;go('practice')});document.getElementById('cancelModal').onclick=()=>modal.classList.add('hidden');
let currentSelection=new Set(),currentSubmitted=false;
function practiceQ(){return questions.find(q=>q.id===state.practiceIds[state.practiceIndex])}
function renderPractice(){const q=practiceQ();if(!q){go('problems');return}crumb.textContent=`${subject().name} ＞ ${unit().name} ＞ 演習`;view.innerHTML=`<div class="row" style="margin-bottom:10px"><button id="backList" class="secondary">‹ 問題一覧</button><div><div style="font-weight:900">演習 ${state.practiceIndex+1}/${state.practiceIds.length}問目</div><div class="listMeta">この問題の履歴 ${hist(q.id).length}/3件</div></div></div><div class="progress" style="margin-bottom:12px"><div style="width:${(state.practiceIndex+1)/state.practiceIds.length*100}%"></div></div><section class="card"><div class="meta"><span class="badge">${q.year}</span><span class="badge gray">${q.exam}</span><span class="badge gray">${q.qnum}</span><span class="badge gray">複数選択可</span></div><h1 class="title" style="font-size:20px">${q.q}</h1><div class="sub" style="margin-bottom:12px">正しいと思う選択肢をすべて選択し、「解答する」を押してください。正解数は事前表示しません。</div><div id="choices" class="choices"></div><div class="historyBox"><div class="sectionTitle">直近3回の演習記録</div>${histHTML(q.id,false)}</div><button id="submit" class="primary" style="margin-top:14px">解答する</button></section><div id="answerArea" class="hidden"><section class="card"><div id="judge" class="result"></div><div id="correctAnswer" style="font-weight:850;margin-top:6px"></div></section><section class="card"><div class="sectionTitle">■ 問題文のポイント</div><div id="points" class="line"></div></section><section class="card"><div class="sectionTitle">■ 各選択肢</div><div id="explanations"></div></section><section class="card"><div class="sectionTitle">■ 出題者の意図</div><div id="intent" class="line"></div></section><section class="card"><div class="sectionTitle">■ 試験用まとめ</div><div id="summary" class="summary"></div></section></div><div class="nav"><button id="prevQ" class="secondary">← 前の問題</button><button id="nextQ" class="secondary">次の問題 →</button></div>`;renderChoices();document.getElementById('backList').onclick=()=>{currentSelection=new Set();currentSubmitted=false;go('problems')};document.getElementById('submit').onclick=submitAnswer;document.getElementById('prevQ').disabled=state.practiceIndex===0;document.getElementById('prevQ').onclick=()=>movePractice(-1);document.getElementById('nextQ').textContent=state.practiceIndex===state.practiceIds.length-1?'演習終了':'次の問題 →';document.getElementById('nextQ').onclick=()=>{if(state.practiceIndex===state.practiceIds.length-1){currentSelection=new Set();currentSubmitted=false;go('problems')}else movePractice(1)}}
function renderChoices(){const q=practiceQ(),box=document.getElementById('choices');if(!box)return;box.innerHTML='';q.choices.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='choice'+(currentSelection.has(i)?' selected':'');b.disabled=currentSubmitted;b.textContent=`${String.fromCharCode(97+i)}. ${t}`;b.onclick=()=>{if(currentSubmitted)return;currentSelection.has(i)?currentSelection.delete(i):currentSelection.add(i);renderChoices()};box.appendChild(b)})}
function same(a,b){if(a.length!==b.length)return false;const x=[...a].sort((m,n)=>m-n),y=[...b].sort((m,n)=>m-n);return x.every((v,i)=>v===y[i])}
function letters(a){return a.map(i=>String.fromCharCode(97+i)).join('・')}
function submitAnswer(){if(!currentSelection.size){alert('1つ以上選択してください。');return}const q=practiceQ(),ok=same([...currentSelection],q.ans);currentSubmitted=true;addAttempt(q.id,ok);document.getElementById('judge').textContent=ok?'○ 正解！':'× 不正解';document.getElementById('judge').className='result '+(ok?'ok':'bad');document.getElementById('correctAnswer').textContent=`正解：${letters(q.ans)}　${q.ans.map(i=>q.choices[i]).join('・')}`;document.getElementById('points').textContent=q.note;document.getElementById('explanations').innerHTML=q.choices.map((c,i)=>{const good=q.ans.includes(i);const corr=q.ans.map(j=>`「${q.choices[j]}」`).join('・');return `<div class="expItem"><div class="expHead">${String.fromCharCode(97+i)}. ${good?'○':'×'}　${c}</div><div class="line">理由：${good?q.note:`この問題では誤り。正しくは ${corr}。`}</div>${good?'':`<div class="line"><strong>正しく直すなら：</strong>${q.note}</div>`}</div>`}).join('');document.getElementById('intent').textContent=`→ 「${q.subtopic}」の典型事項を、似た選択肢と区別できるかを問う問題。`;document.getElementById('summary').textContent=q.note;document.getElementById('answerArea').classList.remove('hidden');document.getElementById('submit').disabled=true;document.getElementById('submit').textContent='解答済み';renderChoices();requestAnimationFrame(()=>document.getElementById('answerArea').scrollIntoView({behavior:'smooth',block:'start'}))}
function movePractice(delta){state.practiceIndex+=delta;save();currentSelection=new Set();currentSubmitted=false;renderPractice();window.scrollTo({top:0,behavior:'smooth'})}
homeBtn.onclick=()=>{state.subjectId=null;state.unitId=null;state.selectedIds=[];state.practiceIds=[];state.practiceIndex=0;currentSelection=new Set();currentSubmitted=false;go('subjects')};
render();
</script></body></html>
