<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>和漢医学概論 QB</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#142033;--muted:#6b7280;--line:#dfe5ee;--accent:#0f79b8;--accent2:#e8f4fb;--ok:#147a46;--bad:#b42318}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}.app{max-width:780px;margin:auto;padding:18px 14px 48px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px}.brand{font-weight:800;font-size:20px}.top-right{text-align:right}.counter{font-size:14px;font-weight:800}.stats{font-size:12px;color:var(--muted);margin-top:3px}.progress{height:8px;background:#e7ebf0;border-radius:999px;overflow:hidden;margin-bottom:16px}.progress>div{height:100%;background:var(--accent);transition:.2s}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.badge{font-size:12px;font-weight:700;padding:6px 9px;border-radius:999px;background:var(--accent2)}.badge.gray{background:#f3f4f6}.badge.ok{background:#e9f7ef;color:var(--ok)}.badge.bad{background:#fdecec;color:var(--bad)}h1{font-size:20px;line-height:1.55;margin:0 0 8px}.hint{font-size:13px;color:var(--muted);margin-bottom:14px}.choices{display:grid;gap:9px}.choice{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:14px;background:#fff;text-align:left;padding:13px 14px;font-size:16px;color:var(--text);cursor:pointer}.choice.selected{border-color:var(--accent);background:var(--accent2)}.btn{min-height:48px;border:0;border-radius:14px;font-weight:800;font-size:16px;padding:0 18px;cursor:pointer}.btn.primary{width:100%;margin-top:14px;background:var(--accent);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}.btn:disabled{opacity:.45;cursor:not-allowed}.nav{display:flex;justify-content:space-between;gap:10px}.result{font-size:21px;font-weight:900;margin-bottom:7px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.correct{font-weight:800}.section-title{font-weight:900;margin-bottom:8px}.exp-item{padding:13px 0;border-top:1px solid var(--line)}.exp-item:first-child{border-top:0;padding-top:0}.exp-head{font-weight:900}.exp-line{font-size:14px;line-height:1.65;margin-top:5px}.summary{background:#f8fafc;border-radius:14px;padding:13px;font-weight:800;line-height:1.65}.hidden{display:none}.footer-note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:15px}@media(max-width:480px){.app{padding:12px 10px 38px}.card{padding:15px}.brand{font-size:18px}}
</style>
</head>
<body>
<main class="app">
<div class="top"><div class="brand">和漢医学概論 QB</div><div class="top-right"><div id="counter" class="counter"></div><div id="stats" class="stats"></div></div></div>
<div class="progress"><div id="bar"></div></div>
<section class="card" id="questionCard">
<div class="meta"><span id="year" class="badge"></span><span id="exam" class="badge gray"></span><span id="qnum" class="badge gray"></span><span class="badge gray">複数選択可</span><span id="previousStatus" class="badge gray hidden"></span></div>
<h1 id="question"></h1><div class="hint">正しいと思う選択肢をすべて選択し、「解答する」を押してください。正解数は事前表示しません。</div><div id="choices" class="choices"></div><button id="submit" class="btn primary">解答する</button>
</section>
<div id="answerArea" class="hidden" tabindex="-1"><section class="card"><div id="judge" class="result"></div><div id="correctAnswer" class="correct"></div></section><section class="card"><div class="section-title">■ 問題文のポイント</div><div id="points"></div></section><section class="card"><div class="section-title">■ 各選択肢</div><div id="explanations"></div></section><section class="card"><div class="section-title">■ 出題者の意図</div><div id="intent"></div></section><section class="card"><div class="section-title">■ 試験用まとめ</div><div id="summary" class="summary"></div></section></div>
<div class="nav"><button id="prev" class="btn secondary">← 前へ</button><button id="next" class="btn secondary">次へ →</button></div>
<div class="footer-note">回答履歴は保存しますが、問題を移動すると選択肢は毎回リセットされます。同じ問題を何度でも解き直せます。</div>
</main>
<script>
const questions=[
{year:"2022年度",exam:"本試",qnum:"第9問",q:"古代中国の伝説上の皇帝で三大古典に関わったとされるのはどれか。",choices:["黄帝","岐伯","神農","張仲景","始皇帝"],ans:[0,2],points:["「伝説上の皇帝」と、三大古典に関わる人物の対応を問う。","PDF記載正答は a・c。"],exps:[["○","黄帝は『黄帝内経』に結びつく伝説上の皇帝。",""],["×","岐伯は黄帝内経で黄帝と問答する医師側の人物。","正しく直すなら：「黄帝内経で黄帝と問答する医師は岐伯」。"],["○","神農は伝説上の人物で、『神農本草経』に結びつく。",""],["×","張仲景は『傷寒論』に結びつく人物で、伝説上の皇帝ではない。","正しく直すなら：「傷寒論に関わる人物は張仲景」。"],["×","始皇帝はこの設問で三大古典に関わる人物ではない。","正しく直すなら：黄帝・神農を選ぶ。"]],intent:"黄帝・神農・張仲景・岐伯の「人物像」と「古典との対応」を区別できるか。",summary:"黄帝 → 黄帝内経 ／ 神農 → 神農本草経 ／ 張仲景 → 傷寒論"},
{year:"2019年度・2024年度",exam:"本試",qnum:"第2問",q:"薬物についての知識をまとめた書物はどれか。",choices:["易経","素問","霊枢","本草綱目","傷寒雑病論"],ans:[3],points:["「薬物についての知識をまとめた書物」がキーワード。","PDF記載正答は d。"],exps:[["×","易経は薬物知識をまとめた本として出題されていない。","正しくは「本草綱目」。"],["×","素問は黄帝内経の一部で、理論中心。","これは東洋医学の理論についての説明なら正しい。"],["×","霊枢は黄帝内経の一部で、鍼灸・経絡など実践中心。","これは鍼灸マニュアルの説明なら正しい。"],["○","本草綱目は薬物についての知識をまとめた書物。",""],["×","傷寒雑病論は疾患と治療法に関する古典。","これは急性・慢性疾患の治療についての説明なら正しい。"]],intent:"本草書と、理論書・鍼灸書・治療書の役割を区別できるか。",summary:"薬物 → 本草綱目 ／ 素問＝理論 ／ 霊枢＝鍼灸 ／ 傷寒雑病論＝治療"},
{year:"2019年度・2024年度",exam:"本試",qnum:"第3問",q:"神農とは誰のことか。",choices:["伝説の皇帝","伝説の名医","鍼灸の発明者","道教の創始者","前漢時代の歴史家"],ans:[0],points:["神農は『神農本草経』とセットで覚える。","PDF記載正答は a。"],exps:[["○","神農は伝説上の皇帝として扱われる。",""],["×","この問題では「伝説の名医」ではない。","正しく直すなら：「神農は伝説の皇帝」。"],["×","鍼灸の発明者ではない。","正しく直すなら：「神農は神農本草経に結びつく伝説上の皇帝」。"],["×","道教の創始者ではない。","正しく直すなら：「神農は伝説の皇帝」。"],["×","前漢時代の歴史家ではない。","正しく直すなら：「神農は伝説上の人物」。"]],intent:"神農を、名医・鍼灸・道教・歴史家などと混同せず識別できるか。",summary:"神農＝伝説の皇帝 → 神農本草経＝薬物書"}
];
const KEY="wakan_qb_history_v2";
let persisted={index:0,history:questions.map(()=>({attempts:0,lastCorrect:null}))};
try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&Array.isArray(x.history)&&x.history.length===questions.length)persisted=x}catch(e){}
let index=Math.max(0,Math.min(questions.length-1,persisted.index||0));
let history=persisted.history;
let currentSelection=new Set();
let currentSubmitted=false;
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify({index,history}))}
function same(a,b){if(a.length!==b.length)return false;const x=[...a].sort((m,n)=>m-n),y=[...b].sort((m,n)=>m-n);return x.every((v,i)=>v===y[i])}
function letters(a){return a.map(i=>String.fromCharCode(97+i)).join("・")}
function counts(){let attempted=0,lastCorrect=0;history.forEach(h=>{if(h.attempts>0){attempted++;if(h.lastCorrect)lastCorrect++}});return{attempted,lastCorrect}}
function resetAttempt(){currentSelection=new Set();currentSubmitted=false}
function render(){const q=questions[index],c=counts(),h=history[index];$("counter").textContent=`演習 ${index+1}/${questions.length}問目`;$("stats").textContent=`全${questions.length}問・演習済み ${c.attempted}問・最新正解 ${c.lastCorrect}問`;$("bar").style.width=((index+1)/questions.length*100)+"%";$("year").textContent=q.year;$("exam").textContent=q.exam;$("qnum").textContent=q.qnum;$("question").textContent=q.q;const ps=$("previousStatus");if(h.attempts>0){ps.classList.remove("hidden","gray","ok","bad");ps.classList.add(h.lastCorrect?"ok":"bad");ps.textContent=`前回 ${h.lastCorrect?"○":"×"}・${h.attempts}回演習`}else{ps.className="badge gray hidden"}$("choices").innerHTML="";q.choices.forEach((t,i)=>{const b=document.createElement("button");b.type="button";b.className="choice"+(currentSelection.has(i)?" selected":"");b.textContent=String.fromCharCode(97+i)+". "+t;b.disabled=currentSubmitted;b.addEventListener("click",()=>{if(currentSubmitted)return;if(currentSelection.has(i))currentSelection.delete(i);else currentSelection.add(i);renderChoices()});$("choices").appendChild(b)});$("submit").disabled=currentSubmitted;$("submit").textContent=currentSubmitted?"解答済み":"解答する";$("prev").disabled=index===0;$("next").textContent=index===questions.length-1?"最初へ ↻":"次へ →";if(!currentSubmitted)$("answerArea").classList.add("hidden")}
function renderChoices(){[...$("choices").children].forEach((b,i)=>b.classList.toggle("selected",currentSelection.has(i)))}
function showAnswer(){const q=questions[index],ok=same([...currentSelection],q.ans);$("answerArea").classList.remove("hidden");$("judge").textContent=ok?"○ 正解！":"× 不正解";$("judge").className="result "+(ok?"ok":"bad");$("correctAnswer").textContent=`正解：${letters(q.ans)}　${q.ans.map(i=>q.choices[i]).join("・")}`;$("points").innerHTML=q.points.map(x=>`<div class="exp-line">・${x}</div>`).join("");$("explanations").innerHTML=q.exps.map((e,i)=>`<div class="exp-item"><div class="exp-head">${String.fromCharCode(97+i)}. ${e[0]}　${q.choices[i]}</div><div class="exp-line">理由：${e[1]}</div>${e[2]?`<div class="exp-line">${e[2]}</div>`:""}</div>`).join("");$("intent").textContent="→ "+q.intent;$("summary").textContent=q.summary;return ok}
$("submit").addEventListener("click",()=>{if(currentSelection.size===0){alert("1つ以上選択してください。");return}const ok=showAnswer();currentSubmitted=true;history[index].attempts+=1;history[index].lastCorrect=ok;persist();render();requestAnimationFrame(()=>$("answerArea").scrollIntoView({behavior:"smooth",block:"start"}))});
function moveTo(newIndex){index=newIndex;persist();resetAttempt();render();window.scrollTo({top:0,behavior:"smooth"})}
$("prev").addEventListener("click",()=>{if(index>0)moveTo(index-1)});
$("next").addEventListener("click",()=>moveTo(index===questions.length-1?0:index+1));
render();
</script>
</body>
</html>
