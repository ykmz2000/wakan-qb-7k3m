<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>M4定期テスト対策QB</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#142033;--muted:#6b7280;--line:#dfe5ee;--accent:#0f79b8;--accent2:#e8f4fb;--ok:#147a46;--bad:#b42318}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}button{font:inherit}.app{max-width:820px;margin:auto;padding:16px 12px 44px}.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.brand{font-weight:900;font-size:21px}.crumb{font-size:12px;color:var(--muted);margin-top:3px}.headerBtn{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 12px;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.title{font-size:21px;font-weight:900;margin:0 0 6px}.sub{color:var(--muted);font-size:13px;line-height:1.55}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.listBtn{width:100%;border:1px solid var(--line);background:white;border-radius:16px;padding:16px;text-align:left;margin:7px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.listTitle{font-weight:850;font-size:17px}.listMeta{font-size:12px;color:var(--muted);margin-top:4px}.arrow{font-size:22px;color:var(--muted)}.progress{height:8px;border-radius:999px;background:#e8edf3;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--accent)}.checkRow{display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:white;border-radius:15px;padding:14px;margin:7px 0}.checkRow input{width:22px;height:22px}.grow{flex:1}.stickyBar{position:sticky;bottom:10px;background:rgba(245,247,251,.94);backdrop-filter:blur(10px);padding:10px 0}.primary{width:100%;border:0;border-radius:14px;background:var(--accent);color:white;min-height:50px;font-weight:900;font-size:16px}.secondary{border:1px solid var(--line);border-radius:13px;background:white;min-height:46px;padding:0 16px;font-weight:800}.problemRow{border-bottom:1px solid var(--line);padding:13px 0}.problemRow:last-child{border-bottom:0}.problemTop{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:start}.qid{font-weight:900;color:var(--accent)}.qtext{line-height:1.5}.historyMini{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.mini{font-size:11px;padding:4px 6px;border-radius:7px;background:#f0f2f5}.mini.ok{background:#e9f7ef;color:var(--ok)}.mini.bad{background:#fdecec;color:var(--bad)}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}.badge{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;background:var(--accent2)}.badge.gray{background:#f3f4f6}.counter{font-size:14px;font-weight:900}.stats{font-size:12px;color:var(--muted);margin-top:3px;text-align:right}.choices{display:grid;gap:9px}.choice{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:14px;background:#fff;text-align:left;padding:13px 14px;font-size:16px}.choice.selected{border-color:var(--accent);background:var(--accent2)}.choice:disabled{opacity:1}.result{font-size:21px;font-weight:900;margin-bottom:6px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.sectionTitle{font-weight:900;margin-bottom:8px}.expItem{border-top:1px solid var(--line);padding:12px 0}.expItem:first-child{border-top:0;padding-top:0}.expHead{font-weight:900}.line{font-size:14px;line-height:1.65;margin-top:5px}.summary{background:#f8fafc;border-radius:14px;padding:12px;font-weight:850;line-height:1.6}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.42);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:50}.modal.hidden,.hidden{display:none}.sheet{width:min(760px,100%);background:white;border-radius:22px;padding:18px}.modeBtn{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:15px;text-align:left;margin-top:9px}.modeBtn strong{display:block;font-size:17px}.modeBtn span{font-size:12px;color:var(--muted)}.historyBox{margin-top:10px;padding:10px;border-radius:12px;background:#f8fafc}.historyBox .line{margin-top:3px}@media(max-width:520px){.brand{font-size:18px}.problemTop{grid-template-columns:54px 1fr}.problemTop .statusCol{grid-column:2}.app{padding:12px 10px 38px}}</style></head><body><main class="app"><div class="header"><div><div class="brand">M4定期テスト対策QB</div><div id="crumb" class="crumb"></div></div><button id="homeBtn" class="headerBtn hidden">科目一覧</button></div><div id="view"></div></main><div id="modeModal" class="modal hidden"><div class="sheet"><div class="title">演習方法を選択</div><div class="sub">問題一覧で選んだ問題を、どの順番で解くか選んでください。</div><button class="modeBtn" data-mode="ordered"><strong>順番通りに解く</strong><span>PDF・問題一覧の順序で演習します</span></button><button class="modeBtn" data-mode="shuffle"><strong>シャッフルして解く</strong><span>選択した問題をランダム順に並べます</span></button><button id="cancelModal" class="secondary" style="width:100%;margin-top:12px">キャンセル</button></div></div><script>
const subjects=[{id:'wakan',name:'和漢医学概論',units:[{id:'history',name:'東洋医学の歴史',enabled:true},{id:'thought',name:'中国古典医学の基盤となる思想',enabled:false},{id:'assessment',name:'病気のアセスメント',enabled:false},{id:'principles',name:'治療法の原則',enabled:false},{id:'shoyaku',name:'生薬',enabled:false},{id:'shoyaku_detail',name:'生薬各論',enabled:false},{id:'prescription',name:'生薬から処方へ',enabled:false},{id:'exam',name:'和漢医学の診察法',enabled:false},{id:'practice',name:'和漢医学の実際',enabled:false},{id:'research',name:'漢方薬研究の最前線',enabled:false}]},{id:'other',name:'他科目（今後追加）',units:[]}];
const questions=[{id:'h001',subject:'wakan',unit:'history',subtopic:'中国古典と人物',year:'2022年度',exam:'本試',qnum:'第9問',q:'古代中国の伝説上の皇帝で三大古典に関わったとされるのはどれか。',choices:['黄帝','岐伯','神農','張仲景','始皇帝'],ans:[0,2],points:['「伝説上の皇帝」と、三大古典に関わる人物の対応を問う。','PDF記載正答は a・c。'],exps:[['○','黄帝は『黄帝内経』に結びつく伝説上の皇帝。',''],['×','岐伯は黄帝内経で黄帝と問答する医師側の人物。','正しく直すなら：「黄帝内経で黄帝と問答する医師は岐伯」。'],['○','神農は伝説上の人物で、『神農本草経』に結びつく。',''],['×','張仲景は『傷寒論』に結びつく人物で、伝説上の皇帝ではない。','正しく直すなら：「傷寒論に関わる人物は張仲景」。'],['×','始皇帝はこの設問で三大古典に関わる人物ではない。','正しく直すなら：黄帝・神農を選ぶ。']],intent:'黄帝・神農・張仲景・岐伯の「人物像」と「古典との対応」を区別できるか。',summary:'黄帝 → 黄帝内経 ／ 神農 → 神農本草経 ／ 張仲景 → 傷寒論'},{id:'h002',subject:'wakan',unit:'history',subtopic:'中国古典と人物',year:'2019年度・2024年度',exam:'本試',qnum:'第2問',q:'薬物についての知識をまとめた書物はどれか。',choices:['易経','素問','霊枢','本草綱目','傷寒雑病論'],ans:[3],points:['「薬物についての知識をまとめた書物」がキーワード。','PDF記載正答は d。'],exps:[['×','易経は薬物知識をまとめた本として出題されていない。','正しくは「本草綱目」。'],['×','素問は黄帝内経の一部で、理論中心。','これは東洋医学の理論についての説明なら正しい。'],['×','霊枢は黄帝内経の一部で、鍼灸・経絡など実践中心。','これは鍼灸マニュアルの説明なら正しい。'],['○','本草綱目は薬物についての知識をまとめた書物。',''],['×','傷寒雑病論は疾患と治療法に関する古典。','これは急性・慢性疾患の治療についての説明なら正しい。']],intent:'本草書と、理論書・鍼灸書・治療書の役割を区別できるか。',summary:'薬物 → 本草綱目 ／ 素問＝理論 ／ 霊枢＝鍼灸 ／ 傷寒雑病論＝治療'},{id:'h003',subject:'wakan',unit:'history',subtopic:'中国古典と人物',year:'2019年度・2024年度',exam:'本試',qnum:'第3問',q:'神農とは誰のことか。',choices:['伝説の皇帝','伝説の名医','鍼灸の発明者','道教の創始者','前漢時代の歴史家'],ans:[0],points:['神農は『神農本草経』とセットで覚える。','PDF記載正答は a。'],exps:[['○','神農は伝説上の皇帝として扱われる。',''],['×','この問題では「伝説の名医」ではない。','正しく直すなら：「神農は伝説の皇帝」。'],['×','鍼灸の発明者ではない。','正しく直すなら：「神農は神農本草経に結びつく伝説上の皇帝」。'],['×','道教の創始者ではない。','正しく直すなら：「神農は伝説の皇帝」。'],['×','前漢時代の歴史家ではない。','正しく直すなら：「神農は伝説上の人物」。']],intent:'神農を、名医・鍼灸・道教・歴史家などと混同せず識別できるか。',summary:'神農＝伝説の皇帝 → 神農本草経＝薬物書'}];
const STORE='m4_qb_v4';let state={screen:'subjects',subjectId:null,unitId:null,selectedIds:[],practiceIds:[],practiceIndex:0,history:{}};try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s)state={...state,...s}}catch(e){}function save(){localStorage.setItem(STORE,JSON.stringify(state))}function hist(id){return state.history[id]||[]}function addAttempt(id,correct){const a={correct,at:new Date().toISOString()};state.history[id]=[a,...hist(id)].slice(0,3);save()}function fmt(iso){const d=new Date(iso);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}function histHTML(id,compact=false){const h=hist(id);if(!h.length)return compact?'<span class="mini">未演習</span>':'<div class="line">まだ演習履歴はありません。</div>';return h.map((a,i)=>compact?`<span class="mini ${a.correct?'ok':'bad'}">${i===0?'前回':(i+1)+'回前'} ${a.correct?'○':'×'} ${fmt(a.at)}</span>`:`<div class="line"><strong>${i===0?'前回':(i+1)+'回前'}：</strong>${a.correct?'○ 正解':'× 不正解'}　${fmt(a.at)}</div>`).join('')}
const view=document.getElementById('view'),crumb=document.getElementById('crumb'),homeBtn=document.getElementById('homeBtn'),modal=document.getElementById('modeModal');function subject(){return subjects.find(s=>s.id===state.subjectId)}function unit(){return subject()?.units.find(u=>u.id===state.unitId)}function qForUnit(){return questions.filter(q=>q.subject===state.subjectId&&q.unit===state.unitId)}function go(screen){state.screen=screen;save();render();window.scrollTo({top:0,behavior:'smooth'})}function render(){homeBtn.classList.toggle('hidden',state.screen==='subjects');if(state.screen==='subjects')renderSubjects();else if(state.screen==='units')renderUnits();else if(state.screen==='problems')renderProblems();else if(state.screen==='practice')renderPractice()}
function renderSubjects(){crumb.textContent='科目を選択';view.innerHTML=`<section class="card"><h1 class="title">科目一覧</h1><div class="sub">勉強する科目を選んでください。</div></section>`+subjects.map(s=>{const count=questions.filter(q=>q.subject===s.id).length;return `<button class="listBtn" data-subject="${s.id}"><div><div class="listTitle">${s.name}</div><div class="listMeta">${count?`収録 ${count}問`:'準備中'}</div></div><div class="arrow">›</div></button>`}).join('');view.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{if(b.dataset.subject==='other')return;state.subjectId=b.dataset.subject;go('units')})}
function renderUnits(){crumb.textContent=`${subject().name} ＞ 単元`;const us=subject().units;view.innerHTML=`<section class="card"><h1 class="title">${subject().name}</h1><div class="sub">単元を選んでください。</div></section>`+us.map(u=>{const qs=questions.filter(q=>q.subject===state.subjectId&&q.unit===u.id);const attempted=qs.filter(q=>hist(q.id).length).length;return `<button class="listBtn" ${u.enabled?'':'disabled'} data-unit="${u.id}"><div><div class="listTitle">${u.name}</div><div class="listMeta">${u.enabled?`${qs.length}問・演習済み ${attempted}問`:'準備中'}</div>${u.enabled?`<div class="progress"><div style="width:${qs.length?attempted/qs.length*100:0}%"></div></div>`:''}</div><div class="arrow">${u.enabled?'›':''}</div></button>`}).join('');view.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{if(b.disabled)return;state.unitId=b.dataset.unit;state.selectedIds=qForUnit().map(q=>q.id);go('problems')})}
function renderProblems(){const qs=qForUnit();if(!state.selectedIds.length)state.selectedIds=qs.map(q=>q.id);const subs=[...new Set(qs.map(q=>q.subtopic))];crumb.textContent=`${subject().name} ＞ ${unit().name} ＞ 問題一覧`;let html=`<section class="card"><h1 class="title">${unit().name}</h1><div class="sub">小テーマ順に整理しています。範囲を選択してから「演習開始」を押してください。</div></section><section class="card"><div class="row"><div class="sectionTitle">範囲選択</div><button id="toggleAll" class="secondary">${state.selectedIds.length===qs.length?'すべて解除':'すべて選択'}</button></div>`;subs.forEach(st=>{const sq=qs.filter(q=>q.subtopic===st),checked=sq.every(q=>state.selectedIds.includes(q.id));html+=`<label class="checkRow"><input type="checkbox" data-subtopic="${st}" ${checked?'checked':''}><div class="grow"><strong>${st}</strong><div class="listMeta">${sq.length}問</div></div></label>`});html+=`</section><section class="card"><div class="sectionTitle">問題一覧（${qs.length}問）</div>`;qs.forEach((q,i)=>html+=`<div class="problemRow"><div class="problemTop"><div class="qid">${i+1}</div><div><div class="qtext">${q.q}</div><div class="listMeta">${q.year}｜${q.exam}｜${q.qnum}</div><div class="historyMini">${histHTML(q.id,true)}</div></div><div class="statusCol"><input type="checkbox" data-qid="${q.id}" ${state.selectedIds.includes(q.id)?'checked':''} style="width:22px;height:22px"></div></div></div>`);html+=`</section><div class="stickyBar"><button id="startPractice" class="primary">演習開始（${state.selectedIds.length}問）</button></div>`;view.innerHTML=html;document.getElementById('toggleAll').onclick=()=>{state.selectedIds=state.selectedIds.length===qs.length?[]:qs.map(q=>q.id);save();renderProblems()};view.querySelectorAll('[data-subtopic]').forEach(cb=>cb.onchange=()=>{const ids=qs.filter(q=>q.subtopic===cb.dataset.subtopic).map(q=>q.id);state.selectedIds=cb.checked?[...new Set([...state.selectedIds,...ids])]:state.selectedIds.filter(id=>!ids.includes(id));save();renderProblems()});view.querySelectorAll('[data-qid]').forEach(cb=>cb.onchange=()=>{state.selectedIds=cb.checked?[...new Set([...state.selectedIds,cb.dataset.qid])]:state.selectedIds.filter(id=>id!==cb.dataset.qid);save();renderProblems()});document.getElementById('startPractice').onclick=()=>{if(!state.selectedIds.length){alert('1問以上選択してください。');return}modal.classList.remove('hidden')}}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}modal.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.practiceIds=b.dataset.mode==='shuffle'?shuffle(state.selectedIds):[...state.selectedIds];state.practiceIndex=0;modal.classList.add('hidden');go('practice')});document.getElementById('cancelModal').onclick=()=>modal.classList.add('hidden');let currentSelection=new Set(),currentSubmitted=false;function practiceQ(){return questions.find(q=>q.id===state.practiceIds[state.practiceIndex])}
function renderPractice(){const q=practiceQ();if(!q){go('problems');return}crumb.textContent=`${subject().name} ＞ ${unit().name} ＞ 演習`;const h=hist(q.id);view.innerHTML=`<div class="row" style="margin-bottom:10px"><button id="backList" class="secondary">‹ 問題一覧</button><div><div class="counter">演習 ${state.practiceIndex+1}/${state.practiceIds.length}問目</div><div class="stats">この問題の履歴 ${h.length}/3件</div></div></div><div class="progress"><div style="width:${(state.practiceIndex+1)/state.practiceIds.length*100}%"></div></div><section class="card"><div class="meta"><span class="badge">${q.year}</span><span class="badge gray">${q.exam}</span><span class="badge gray">${q.qnum}</span><span class="badge gray">複数選択可</span></div><h1 class="title" style="font-size:20px">${q.q}</h1><div class="sub" style="margin-bottom:12px">正しいと思う選択肢をすべて選択し、「解答する」を押してください。正解数は事前表示しません。</div><div id="choices" class="choices"></div><div class="historyBox"><div class="sectionTitle">直近3回の演習記録</div>${histHTML(q.id,false)}</div><button id="submit" class="primary" style="margin-top:14px">解答する</button></section><div id="answerArea" class="hidden"><section class="card"><div id="judge" class="result"></div><div id="correctAnswer" style="font-weight:850"></div></section><section class="card"><div class="sectionTitle">■ 問題文のポイント</div><div id="points"></div></section><section class="card"><div class="sectionTitle">■ 各選択肢</div><div id="explanations"></div></section><section class="card"><div class="sectionTitle">■ 出題者の意図</div><div id="intent" class="line"></div></section><section class="card"><div class="sectionTitle">■ 試験用まとめ</div><div id="summary" class="summary"></div></section></div><div class="nav"><button id="prevQ" class="secondary">← 前の問題</button><button id="nextQ" class="secondary">次の問題 →</button></div>`;renderChoices();document.getElementById('backList').onclick=()=>{currentSelection=new Set();currentSubmitted=false;go('problems')};document.getElementById('submit').onclick=submitAnswer;document.getElementById('prevQ').disabled=state.practiceIndex===0;document.getElementById('prevQ').onclick=()=>movePractice(-1);document.getElementById('nextQ').textContent=state.practiceIndex===state.practiceIds.length-1?'演習終了':'次の問題 →';document.getElementById('nextQ').onclick=()=>{if(state.practiceIndex===state.practiceIds.length-1){currentSelection=new Set();currentSubmitted=false;go('problems')}else movePractice(1)}}
function renderChoices(){const q=practiceQ(),box=document.getElementById('choices');if(!box)return;box.innerHTML='';q.choices.forEach((t,i)=>{const b=document.createElement('button');b.className='choice'+(currentSelection.has(i)?' selected':'');b.textContent=String.fromCharCode(97+i)+'. '+t;b.disabled=currentSubmitted;b.onclick=()=>{if(currentSubmitted)return;currentSelection.has(i)?currentSelection.delete(i):currentSelection.add(i);renderChoices()};box.appendChild(b)})}function same(a,b){if(a.length!==b.length)return false;const x=[...a].sort((m,n)=>m-n),y=[...b].sort((m,n)=>m-n);return x.every((v,i)=>v===y[i])}function letters(a){return a.map(i=>String.fromCharCode(97+i)).join('・')}function submitAnswer(){if(!currentSelection.size){alert('1つ以上選択してください。');return}const q=practiceQ(),ok=same([...currentSelection],q.ans);currentSubmitted=true;addAttempt(q.id,ok);document.getElementById('submit').disabled=true;document.getElementById('submit').textContent='解答済み';renderChoices();const area=document.getElementById('answerArea');area.classList.remove('hidden');document.getElementById('judge').textContent=ok?'○ 正解！':'× 不正解';document.getElementById('judge').className='result '+(ok?'ok':'bad');document.getElementById('correctAnswer').textContent=`正解：${letters(q.ans)}　${q.ans.map(i=>q.choices[i]).join('・')}`;document.getElementById('points').innerHTML=q.points.map(x=>`<div class="line">・${x}</div>`).join('');document.getElementById('explanations').innerHTML=q.exps.map((e,i)=>`<div class="expItem"><div class="expHead">${String.fromCharCode(97+i)}. ${e[0]}　${q.choices[i]}</div><div class="line">理由：${e[1]}</div>${e[2]?`<div class="line">${e[2]}</div>`:''}</div>`).join('');document.getElementById('intent').textContent='→ '+q.intent;document.getElementById('summary').textContent=q.summary;requestAnimationFrame(()=>area.scrollIntoView({behavior:'smooth',block:'start'}))}function movePractice(delta){state.practiceIndex+=delta;save();currentSelection=new Set();currentSubmitted=false;renderPractice();window.scrollTo({top:0,behavior:'smooth'})}homeBtn.onclick=()=>{state.subjectId=null;state.unitId=null;state.selectedIds=[];state.practiceIds=[];state.practiceIndex=0;go('subjects')};render();
</script></body></html>
