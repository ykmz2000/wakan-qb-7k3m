name: PR25 targeted regression isolation
on:
  push:
    branches: ['feat/image-editor-ux-and-large-images']
    paths: ['.github/workflows/pr25-targeted-regressions.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prepare browser fixtures
        shell: bash
        run: |
          mkdir -p /tmp/qb-inline-build
          cp editor-build/package.json /tmp/qb-inline-build/package.json
          npm install --prefix /tmp/qb-inline-build --ignore-scripts --package-lock=false --no-audit --no-fund
          node scripts/build-inline-overview.cjs
          npm install --prefix /tmp/qb-browser-tests --no-save --package-lock=false playwright@1.63.0 cropperjs@1.6.2
      - name: Native density regression
        env:
          NODE_PATH: /tmp/qb-browser-tests/node_modules
        run: node tests/image-editor-native.browser.cjs
      - name: Annotation regression
        env:
          NODE_PATH: /tmp/qb-browser-tests/node_modules
        run: node tests/image-annotation.browser.cjs
      - name: Upload edit regression
        env:
          NODE_PATH: /tmp/qb-browser-tests/node_modules
        run: node tests/image-library-upload-edit.browser.cjs
      - name: Library sets regression
        env:
          NODE_PATH: /tmp/qb-browser-tests/node_modules
        run: node tests/image-library-sets.browser.cjs
