name: Apply verified PR25 source refinements
on:
  push:
    branches: [feat/image-editor-ux-and-large-images]
    paths: ['.github/workflows/pr25-apply-verified-edits.yml', '.qa/edits-*.json']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'ykmz2000/wakan-qb-7k3m' && github.ref == 'refs/heads/feat/image-editor-ux-and-large-images'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source hashes and apply reviewed app edits
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          expected={'.github/workflows/image-library-tests.yml','image-annotation-editor-v1.js','image-annotation-model-v1.js','image-annotation-v1.css','image-crop-editor-v1.js','image-editor-source-picker-v1.js','image-library-ui-v1.js','image-viewer.js','index.html','official-edit-images.js','qb-media-notes-v2.js','question-image-export-v1.js','question-stem-images-v2.js','tests/explanation-image-layout.browser.cjs','tests/image-annotation.browser.cjs','tests/image-annotation.unit.cjs','tests/image-crop.browser.cjs','tests/image-editor-ux.browser.cjs','tests/image-upload-limits.unit.cjs'}
          rows=[json.loads(p.read_text()) for p in Path('.qa').glob('edits-*.json')]
          assert len(rows)==19 and {r['path'] for r in rows}==expected
          digest=lambda s:hashlib.sha256(s.encode('utf-8')).hexdigest()
          results={}
          for r in rows:
              p=Path(r['path']);text=p.read_text() if p.exists() else ''
              assert (digest(text) if p.exists() else None)==r['before'], 'Concurrent edit: '+str(p)
              last=0
              for a,b,_ in r['edits']:
                  assert 0<=last<=a<=b<=len(text)
                  last=b
              for a,b,replacement in reversed(r['edits']):
                  text=text[:a]+replacement+text[b:]
              assert digest(text)==r['after'], 'Transport mismatch: '+str(p)
              if not str(p).startswith('.github/'):
                  results[p]=text
          for p,text in results.items():
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
              if p.suffix in ('.js','.cjs'):subprocess.run(['node','--check',str(p)],check=True)
          subprocess.run(['node','--test','tests/image-annotation.unit.cjs','tests/image-upload-limits.unit.cjs'],check=True)
          branch='feat/image-editor-ux-and-large-images'
          subprocess.run(['git','fetch','origin',branch],check=True)
          assert subprocess.check_output(['git','rev-parse','FETCH_HEAD'],text=True).strip()==os.environ['GITHUB_SHA'], 'Branch changed during verification'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*[str(p) for p in results]],check=True)
          subprocess.run(['git','commit','-m','Preserve native collage and crop pixels; complete source and UI regressions'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          PY
