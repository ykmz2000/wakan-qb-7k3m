name: Verify PR25 Blob fallback decode order
on:
  push:
    branches: ['feat/image-editor-ux-and-large-images']
    paths: ['.github/workflows/pr25-blob-fallback-order.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prefer normal image decode and use bitmap only as WebKit fallback
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def sha(p): return subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          p=Path('image-annotation-editor-v1.js')
          assert sha(p)=='e3af13c833fa0ea9a222cbbe70f79d6cbec9c8a1', 'Editor changed; inspect first'
          s=p.read_text()
          old="  const asset=async input=>{const isBlob=input instanceof Blob;if(isBlob&&input.size>MAX_IMAGE_BYTES)throw Error('追加する画像は100MB以下にしてください。');const url=isBlob?URL.createObjectURL(input):String(input);if(isBlob)urls.push(url);let img;if(isBlob&&typeof createImageBitmap==='function'){try{img=await createImageBitmap(input)}catch{img=await loadImage(url)}}else img=await loadImage(url);const id='asset-'+(++sequence);assets.set(id,{img,url});return id};"
          new="  const asset=async input=>{const isBlob=input instanceof Blob;if(isBlob&&input.size>MAX_IMAGE_BYTES)throw Error('追加する画像は100MB以下にしてください。');const url=isBlob?URL.createObjectURL(input):String(input);if(isBlob)urls.push(url);let img;try{img=await loadImage(url)}catch(error){if(!isBlob||typeof createImageBitmap!=='function')throw error;img=await createImageBitmap(input)}const id='asset-'+(++sequence);assets.set(id,{img,url});return id};"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          node --check image-annotation-editor-v1.js
          git diff --check
      - name: Prepare browser fixtures
        shell: bash
        run: |
          mkdir -p /tmp/qb-inline-build
          cp editor-build/package.json /tmp/qb-inline-build/package.json
          npm install --prefix /tmp/qb-inline-build --ignore-scripts --package-lock=false --no-audit --no-fund
          node scripts/build-inline-overview.cjs
          npm install --prefix /tmp/qb-browser-tests --no-save --package-lock=false playwright@1.63.0 cropperjs@1.6.2
      - name: Verify source routes and native export
        env:
          NODE_PATH: /tmp/qb-browser-tests/node_modules
        shell: bash
        run: |
          node tests/image-editor-sources.browser.cjs
          node tests/image-editor-native.browser.cjs
          node tests/image-annotation.browser.cjs
      - name: Commit verified decode order
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add image-annotation-editor-v1.js
          git commit -m 'Use ImageBitmap only as WebKit Blob decode fallback'
          git push origin HEAD:refs/heads/feat/image-editor-ux-and-large-images
