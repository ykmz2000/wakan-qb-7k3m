name: Apply verified PR25 WebKit source import fix
on:
  push:
    branches: ['feat/image-editor-ux-and-large-images']
    paths: ['.github/workflows/pr25-fix-source-preparation.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply focused source-import fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def sha(p):
              return subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          p=Path('image-annotation-editor-v1.js')
          assert sha(p)=='c5ad9491cd68ba170ec2ff395df04ebc0bc45702', 'Editor changed; inspect before overwriting'
          s=p.read_text()
          old="function loadImage(source){return new Promise((resolve,reject)=>{const img=new Image();img.crossOrigin='anonymous';img.onload=()=>resolve(img);img.onerror=()=>reject(Error('画像を開けませんでした。PNG・JPEG・WebPなどの画像をお試しください。'));img.src=source})}"
          new="function loadImage(source){return new Promise((resolve,reject)=>{const img=new Image();if(/^https?:/i.test(String(source)))img.crossOrigin='anonymous';img.onload=()=>resolve(img);img.onerror=()=>reject(Error('画像を開けませんでした。PNG・JPEG・WebPなどの画像をお試しください。'));img.src=source})}"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    const blobs=[];let complete=false;childMode(true);status.textContent='画像を準備中…';"
          new="    const blobs=[];let complete=false;busy=true;childMode(true);update();status.textContent='画像を準備中…';"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    }catch(e){status.textContent='画像を追加できませんでした：'+(e.message||e)}finally{childMode(false)}\n    if(complete&&blobs.length&&!closed)await addImages(blobs);"
          new="    }catch(e){status.textContent='画像を追加できませんでした：'+(e.message||e)}finally{busy=false;childMode(false);if(!closed)update()}\n    if(complete&&blobs.length&&!closed)await addImages(blobs);"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          subprocess.run(['node','--check',str(p)],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add image-annotation-editor-v1.js
          git commit -m 'Fix WebKit blob image imports and lock source preparation'
          git push origin HEAD:refs/heads/feat/image-editor-ux-and-large-images
