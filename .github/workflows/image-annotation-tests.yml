name: Image annotation and question export regression
on:
  push:
    branches: [feat/image-annotation-export]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-annotation-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned inline editor
        run: |
          mkdir -p /tmp/qb-inline-build
          cp editor-build/package.json /tmp/qb-inline-build/package.json
          npm install --prefix /tmp/qb-inline-build --ignore-scripts --package-lock=false --no-audit --no-fund
          node scripts/build-inline-overview.cjs
          node --check inline-overview-v1.js
          node --check image-annotation-editor-v1.js
          node --check image-edit-integration-v1.js
          node --check image-edit-storage-v1.js
          node --check question-image-export-v1.js
      - name: Model and text-format unit checks
        run: node --test tests/image-annotation.unit.cjs tests/explanation-format.unit.cjs
      - name: Install pinned browser client and cropper
        run: npm install --prefix /tmp/qb-browser-tests --no-save --package-lock=false playwright@1.63.0 cropperjs@1.6.2
      - name: Image annotation, context paste, persistence and export
        env:
          NODE_PATH: /tmp/qb-browser-tests/node_modules
        run: |
          node tests/image-interaction.browser.cjs
          node tests/image-annotation.browser.cjs
      - name: Existing editing, image and learning regressions
        env:
          NODE_PATH: /tmp/qb-browser-tests/node_modules
        run: |
          node tests/problem-source-filter.browser.cjs
          node tests/inline-choice.browser.cjs
          node tests/answer-history.browser.cjs
          node tests/explanation-format.browser.cjs
          node tests/editor-appearance-stem.browser.cjs
          node tests/inline-overview.browser.cjs
          node tests/inline-stem.browser.cjs
          node tests/inline-enter.browser.cjs
          node tests/fill-blank-reference.browser.cjs
          node tests/question-image-add-theme.browser.cjs
          node tests/recent-image-scope-preview.browser.cjs
          node tests/image-crop.browser.cjs
          node tests/image-gallery.browser.cjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-annotation-browser-results
          path: /tmp/qb-annotation-results
          retention-days: 7
