<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>ランキング｜定期テスト対策QB</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6f7786;--line:#dce3ec;--accent:#126fb3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}.app{max-width:850px;margin:auto;padding:12px 10px 40px}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:24px}.title{font-size:22px;font-weight:900}.sub{font-size:12px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:10px;overflow:hidden}.sectionTitle{font-size:17px;font-weight:900;margin-bottom:10px}.tabs{display:flex;gap:8px;margin-bottom:10px}.tab{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;font-weight:900}.tab.on{background:var(--accent);color:#fff}.rankRow{display:grid;grid-template-columns:34px 42px minmax(0,1fr) auto;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #eef1f5;min-width:0}.rankRow:last-child{border-bottom:0}.rankRow>div{min-width:0}.rankRow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rankNo{font-weight:900;color:var(--accent);text-align:center}.avatar{width:38px;height:38px;border-radius:50%;background:#126fb3;color:#fff;display:grid;place-items:center;font-weight:900;background-size:cover;background-position:center}.meRow{margin-top:10px;padding:10px;border:2px solid var(--accent);border-radius:13px}.attempts{font-weight:900;white-space:nowrap}.chartWrap,.barScroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain;padding-bottom:4px}.chartWrap svg{width:700px;min-width:700px;height:auto;display:block}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}.muted{color:var(--muted)}.error{color:#d04444}.stamp{text-align:right;font-size:11px;color:var(--muted);margin-top:6px}.miniBars{display:flex;align-items:end;gap:4px;height:140px;padding:8px 2px 0;min-width:680px}.barCol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:22px;height:100%}.bar{width:100%;max-width:26px;background:#9ecbe9;border-radius:6px 6px 0 0;min-height:2px}.barLabel{font-size:9px;color:var(--muted);margin-top:4px;white-space:nowrap}.barVal{font-size:9px;font-weight:800;margin-bottom:3px}@media(max-width:520px){.title{font-size:19px}.rankRow{grid-template-columns:28px 38px minmax(0,1fr) auto}.avatar{width:34px;height:34px}.card{padding:13px}.chartWrap,.barScroll{margin-right:-13px;padding-right:13px}}</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.length>1?history.back():location.href='./index.html'">‹</button><div><div class="title">ランキング</div><div class="sub">利用ユーザー内で集計</div></div></div><div id="app"><div class="card">読み込み中…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="ranking.js?v=20260905-57"></script></body></html>
